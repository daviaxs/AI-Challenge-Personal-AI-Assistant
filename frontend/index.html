<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Challenge: Personal AI Assistant</title>

    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="google" content="notranslate">
    <meta name="google" content="notranslate">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <!-- Loading Styles -->
    <link rel="stylesheet" href="/src/styles/global-loading.css">
    
    <!-- Script para prevenir FOUC - executa ANTES do React carregar -->
    <script>
      try {
        const theme = localStorage.getItem('theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const shouldBeDark = theme === 'dark' || (!theme && systemDark);
        
        if (shouldBeDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (error) {
        // Fallback para quando localStorage não está disponível
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      }
    </script>
    <style>
      /* Loading screen inicial para prevenir FOUC */
      #initial-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 24px;
        transition: opacity 0.3s ease-out;
      }
      
      /* Tema escuro para o loading inicial */
      .dark #initial-loading {
        background-color: #191D1F;
        color: white;
      }
      
      .initial-loading-text {
        color: #424750;
        font-size: 24px;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        margin-top: 20px;
      }
      
      .dark .initial-loading-text {
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- Loading screen inicial - removido quando o React carrega -->
    <div id="initial-loading">
      <div class="loader"></div>
      <div class="initial-loading-text">AI Challenge</div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
